services:
  - type: web
    name: insight-constitutional-runtime
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/register_runtime.py && uvicorn insight_execution_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: INSIGHT_SERVICE_URL
        sync: false
        # Set this to the Render public URL after first deploy.
        # Example: https://insight-constitutional-runtime.onrender.com
      - key: PLATFORM_BASE_URL
        value: "https://bhiv-qcg.onrender.com"
      - key: QUANTUM_RUNTIME_URL
        value: "https://marine-quantum-runtime-final.onrender.com"
      - key: QUANTUM_RUNTIME_MODE
        value: "LIVE"
      - key: QUANTUM_RUNTIME_API_KEY
        sync: false
      - key: Quantum_Runtime_Auth_Key
        sync: false
      - key: PLATFORM_TIMEOUT
        value: "45"
