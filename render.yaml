services:
  - type: web
    name: insight-constitutional-runtime
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn insight_execution_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: INSIGHT_SERVICE_URL
        sync: false
        # Set this to the Render public URL after first deploy.
        # Example: https://insight-constitutional-runtime.onrender.com
